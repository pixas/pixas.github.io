name: Update Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citation-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install optional scraper
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r google_scholar_crawler/requirements.txt \
            || echo "scholarly install failed; direct Google Scholar HTML parsing still works"

      - name: Fetch citation stats
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          AUTHOR_NAME: Shuyang Jiang
          CONTACT_EMAIL: jiangshuyang0@gmail.com
        run: python google_scholar_crawler/main.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/citations.json
          if git diff --cached --quiet; then
            echo "No citation changes, skipping commit"
            exit 0
          fi
          git commit -m "chore: update Google Scholar citation data"
          git push
